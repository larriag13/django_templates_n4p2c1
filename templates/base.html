<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django TEMPLATES Project{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <!-- header>nav>ul>li>a -->
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'inicio:index' %}">Inicio</a></li>
                <li><a href="{% url 'app2:v1' %}">App2 V1</a></li>
                <li><a href="{% url 'app2:v2' %}">App2 V2</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}

        {% endblock %}
    </main>
    <footer>
        <p>&copy; Django Project Templates 2026</p>
    </footer>
</body>

</html>
